
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة باب الفرح</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f7f3eb;
      color: #493b2b;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }
    h1 { color: #aa8950; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font: inherit;
    }
    input { border: 1px solid #ddd2bf; }
    button {
      border: 0;
      background: #aa8950;
      color: white;
      cursor: pointer;
    }
    .secondary { background: #6d6253; }
    .item {
      padding: 14px;
      border: 1px solid #e6ddcf;
      border-radius: 10px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
    .hidden { display: none; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>باب الفرح</h1>
  <p style="text-align:center">لوحة الإدارة الخاصة</p>

  <section id="login">
    <h3>تسجيل دخول الإدارة</h3>
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
  </section>

  <section id="panel" class="hidden">
    <h3>إضافة أو تعديل دعوة</h3>
    <form id="inviteForm">
      <input id="slug" required placeholder="رمز رابط الدعوة، مثال wedding-001">
      <input id="groom" required placeholder="اسم العريس">
      <input id="bride" required placeholder="اسم العروس">
      <label>تاريخ الحفل</label>
      <input id="date" type="date">
      <input id="day" placeholder="يوم الحفل">
      <input id="time" placeholder="وقت الحفل">
      <input id="venue" placeholder="اسم القاعة">
      <input id="map" type="url" placeholder="رابط موقع القاعة على الخريطة">
      <input id="phone" type="tel" placeholder="رقم التواصل">
      <label>رقم التصميم من 1 إلى 8</label>
      <input id="template" type="number" min="1" max="8" value="1" required>
      <label>
        <input id="published" type="checkbox" style="width:auto">
        نشر الدعوة لتكون متاحة عبر رابطها
      </label>
      <button type="submit">حفظ الدعوة</button>
      <button type="button" class="secondary" id="newBtn">دعوة جديدة</button>
    </form>

    <h3>دعواتي</h3>
    <button id="refreshBtn">تحديث القائمة</button>
    <div id="list"></div>
    <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
  </section>

  <p id="status" role="status"></p>
</main>

<script>
  // استبدل القيمتين بمعلومات مشروعك من Supabase.
  
const SUPABASE_URL = "https://gnsnbretccdlwpmimuap.supabase.co";

  const SUPABASE_KEY = "sb_publishable_-YuiIyffuaJ9TkLO_bxesA_rbFOqJKU";

  const db = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  let editingId = null;
  const $ = id => document.getElementById(id);
  const status = message => $("status").textContent = message;

  function showSession(session) {
    $("login").classList.toggle("hidden", !!session);
    $("panel").classList.toggle("hidden", !session);
    if (session) loadInvitations();
  }

  $("loginBtn").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) return status("تعذر الدخول: " + error.message);
    status("تم تسجيل الدخول.");
  };

  db.auth.onAuthStateChange((_event, session) => {
    showSession(session);
  });

  async function loadInvitations() {
    const { data, error } = await db
      .from("invitations")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) return status("تعذر تحميل الدعوات: " + error.message);

    $("list").innerHTML = "";
    for (const item of data || []) {
      const card = document.createElement("div");
      card.className = "item";

      const title = document.createElement("strong");
      title.textContent = item.groom_name + " و " + item.bride_name;

      const details = document.createElement("p");
      details.textContent =
        "الرابط: " + location.origin +
        location.pathname.replace(/admin\.html$/, "") +
        "?invite=" + encodeURIComponent(item.slug) +
        " — " + (item.is_published ? "منشورة" : "غير منشورة");

      const edit = document.createElement("button");
      edit.textContent = "تعديل";
      edit.onclick = () => fillForm(item);

      card.append(title, details, edit);
      $("list").appendChild(card);
    }
    status("تم تحديث قائمة الدعوات.");
  }

  function fillForm(item) {
    editingId = item.id;
    $("slug").value = item.slug || "";
    $("groom").value = item.groom_name || "";
    $("bride").value = item.bride_name || "";
    $("date").value = item.wedding_date || "";
    $("day").value = item.day_name || "";
    $("time").value = item.wedding_time || "";
    $("venue").value = item.venue_name || "";
    $("map").value = item.map_url || "";
    $("phone").value = item.contact_phone || "";
    $("template").value = item.template_id || 1;
    $("published").checked = !!item.is_published;
    status("تعدّل هسه الدعوة المختارة.");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("inviteForm").onsubmit = async event => {
    event.preventDefault();

    const record = {
      slug: $("slug").value.trim(),
      groom_name: $("groom").value.trim(),
      bride_name: $("bride").value.trim(),
      wedding_date: $("date").value || null,
      day_name: $("day").value.trim(),
      wedding_time: $("time").value.trim(),
      venue_name: $("venue").value.trim(),
      map_url: $("map").value.trim(),
      contact_phone: $("phone").value.trim(),
      template_id: Number($("template").value),
      is_published: $("published").checked
    };

    if (!/^[a-zA-Z0-9-]+$/.test(record.slug)) {
      return status("اكتب رمز الرابط بحروف إنجليزية أو أرقام أو شرطة فقط.");
    }

    let result;
    if (editingId) {
      result = await db.from("invitations")
        .update(record).eq("id", editingId);
    } else {
      result = await db.from("invitations").insert(record);
    }

    if (result.error) {
      return status("لم يتم الحفظ: " + result.error.message);
    }

    status("تم حفظ الدعوة.");
    $("inviteForm").reset();
    $("template").value = 1;
    editingId = null;
    await loadInvitations();
  };

  $("newBtn").onclick = () => {
    $("inviteForm").reset();
    $("template").value = 1;
    editingId = null;
    status("جاهز لإضافة دعوة جديدة.");
  };

  $("refreshBtn").onclick = loadInvitations;

  $("logoutBtn").onclick = async () => {
    await db.auth.signOut();
    status("تم تسجيل الخروج.");
  };

  db.auth.getSession().then(({ data }) => {
    showSession(data.session);
  });
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة باب الفرح</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f5f0e7;color:#493b2b;font-family:Tahoma,Arial,sans-serif}
main{max-width:720px;margin:15px auto;background:#fffdf9;padding:22px;border:1px solid #e5d6b7;border-radius:20px;box-shadow:0 8px 30px #38240e12}
h1{text-align:center;color:#aa8950}
h3{color:#8d703e;margin-top:25px}
.subtitle{text-align:center;color:#81715d}
label{display:block;margin:12px 0 5px;font-weight:bold;font-size:14px}
input,button,select,textarea{width:100%;padding:13px;margin:6px 0;border-radius:9px;font:inherit}
input,select,textarea{border:1px solid #ddd2bf;background:white;color:#493b2b}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:auto}
button{border:0;background:#aa8950;color:white;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5}
.secondary{background:#6d6253}
.hidden{display:none!important}
.help{font-size:12px;color:#81715d;line-height:1.8}
.door-panel{margin:15px 0;padding:14px;border:1px solid #e5d6b7;border-radius:14px;background:#fbf7ef}
.door-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.door-option{margin:0;background:white;color:#493b2b;border:1px solid #ded0b7;font-size:13px;line-height:1.7}
.door-option.selected{border:2px solid #aa8950;background:#f5ecd9;color:#755821}
.number{display:block;font-size:22px;color:#aa8950;font-weight:bold}
.door-description{font-size:13px;line-height:1.8;color:#746550}
.item{padding:15px;border:1px solid #e6ddcf;border-radius:12px;margin-top:12px;background:white;line-height:1.9;overflow-wrap:anywhere}
.item strong{color:#8d703e}
.item a{display:block;color:#8d703e;overflow-wrap:anywhere}
.item button{margin-top:8px}
.published{color:#28734b;font-weight:bold}
.unpublished{color:#956126;font-weight:bold}
#status{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}
@media(max-width:480px){main{padding:14px;margin:4px auto}body{padding:7px}}
</style>
</head>
<body>
<main>
<h1>باب الفرح</h1>
<p class="subtitle">لوحة إدارة دعوات الزفاف الإلكترونية</p>

<section id="login">
<h3>تسجيل دخول الإدارة</h3>
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني">
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<button id="loginBtn" type="button">تسجيل الدخول</button>
</section>

<section id="panel" class="hidden">
<h3 id="formTitle">إضافة دعوة جديدة</h3>

<form id="inviteForm">
<label for="slug">رابط الدعوة (يتولد تلقائياً)</label>
<input id="slug" readonly required>
<p class="help">كل دعوة تحصل على رمز خاص تلقائياً. عند تعديل دعوة قديمة يبقى رابطها نفسه.</p>

<label for="groom">اسم العريس</label>
<input id="groom" required placeholder="اسم العريس">
<label for="bride">اسم العروس</label>
<input id="bride" required placeholder="اسم العروس">
<label for="date">تاريخ الحفل</label>
<input id="date" type="date">
<label for="day">يوم الحفل</label>
<input id="day" placeholder="مثال: الخميس">
<label for="time">وقت الحفل</label>
<input id="time" placeholder="مثال: الثامنة مساءً">
<label for="venue">اسم القاعة</label>
<input id="venue" placeholder="اسم قاعة الأفراح">
<label for="map">رابط موقع القاعة على الخريطة</label>
<input id="map" type="url" placeholder="https://maps.google.com/...">
<label for="phone">رقم التواصل</label>
<input id="phone" type="tel" placeholder="رقم الهاتف">
<label for="notes">ملاحظات الدعوة (اختياري)</label>
<textarea id="notes" rows="3" placeholder="اكتب الملاحظات التي تريد إضافتها للدعوة..."></textarea>

<div class="door-panel">
<label for="audioType">اختيار الصوت عند فتح الباب</label>
<select id="audioType">
<option value="none">🔇 بدون صوت</option>
<option value="song">🎵 أغنية زفاف رومانسية</option>
<option value="quran">📖 القرآن الكريم — سورة الروم، الآية 21</option>
</select>
<p class="help">اختار صوتاً واحداً لكل دعوة. قد يحتاج تشغيل الصوت إلى تفاعل من الزائر حسب إعدادات المتصفح.</p>
</div>

<div class="door-panel">
<label>اختيار تصميم الباب</label>
<input id="template" type="hidden" value="1">
<div class="door-grid">
<button type="button" class="door-option selected" data-id="1"><span class="number">01</span>الملكي الذهبي</button>
<button type="button" class="door-option" data-id="2"><span class="number">02</span>الأبيض الملكي</button>
<button type="button" class="door-option" data-id="3"><span class="number">03</span>التراثي الشرقي</button>
<button type="button" class="door-option" data-id="4"><span class="number">04</span>الزجاجي الحديث</button>
<button type="button" class="door-option" data-id="5"><span class="number">05</span>الأخضر الملكي</button>
<button type="button" class="door-option" data-id="6"><span class="number">06</span>الوردي الرومانسي</button>
<button type="button" class="door-option" data-id="7"><span class="number">07</span>الأزرق الليلي</button>
<button type="button" class="door-option" data-id="8"><span class="number">08</span>الرخام الفخم</button>
<button type="button" class="door-option" data-id="9"><span class="number">09</span>العنابي الملكي</button>
<button type="button" class="door-option" data-id="10"><span class="number">10</span>الفضي العصري</button>
<button type="button" class="door-option" data-id="11"><span class="number">11</span>الخشب الطبيعي</button>
<button type="button" class="door-option" data-id="12"><span class="number">12</span>البنفسجي الفاخر</button>
<button type="button" class="door-option" data-id="13"><span class="number">13</span>اللؤلؤي الوردي</button>
<button type="button" class="door-option" data-id="14"><span class="number">14</span>الزمردي الذهبي</button>
</div>
<p id="doorDescription" class="door-description"></p>
</div>

<label><input id="published" type="checkbox"> نشر الدعوة لتكون متاحة عبر رابطها</label>
<button type="submit" id="saveBtn">حفظ الدعوة</button>
<button type="button" class="secondary" id="newBtn">دعوة جديدة</button>
</form>

<h3>دعواتي</h3>
<button id="refreshBtn" type="button">تحديث القائمة</button>
<div id="list"></div>
<button id="logoutBtn" type="button" class="secondary">تسجيل الخروج</button>
</section>

<p id="status" role="status" aria-live="polite"></p>
</main>

<script>
const SUPABASE_URL="https://gnsnbretccdlwpmimuap.supabase.co";
const SUPABASE_KEY="sb_publishable_-YuiIyffuaJ9TkLO_bxesA_rbFOqJKU";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let editingId=null;
let busy=false;

const doorNames={
1:"الملكي الذهبي",
2:"الأبيض الملكي",
3:"التراثي الشرقي",
4:"الزجاجي الحديث",
5:"الأخضر الملكي",
6:"الوردي الرومانسي",
7:"الأزرق الليلي",
8:"الرخام الفخم",
9:"العنابي الملكي",
10:"الفضي العصري",
11:"الخشب الطبيعي",
12:"البنفسجي الفاخر",
13:"اللؤلؤي الوردي",
14:"الزمردي الذهبي"
};

const doorDescriptions={
1:"أسود ملكي مع زخارف ذهبية.",
2:"أبيض عاجي بلمسات ذهبية.",
3:"خشب داكن بنقوش شرقية.",
4:"زجاج حديث بإطار معدني.",
5:"أخضر زمردي بتفاصيل نحاسية.",
6:"وردي لؤلؤي رومانسي.",
7:"أزرق ليلي بزخارف فضية.",
8:"رخام عاجي بخطوط برونزية.",
9:"عنابي عميق مع لمسات ذهبية.",
10:"فضي ورمادي بتصميم عصري.",
11:"خشب طبيعي دافئ بتفاصيل نحاسية.",
12:"بنفسجي فاخر بإطار ذهبي.",
13:"وردي لؤلؤي بتفاصيل ناعمة.",
14:"زمردي غني مع زخارف ذهبية."
};

const audioNames={
none:"بدون صوت",
song:"أغنية زفاف",
quran:"القرآن الكريم — سورة الروم، الآية 21"
};

function status(message){
 $("status").textContent=message;
}

function makeSlug(){
 const bytes=new Uint8Array(7);
 crypto.getRandomValues(bytes);
 const token=Array.from(bytes,b=>b.toString(36).padStart(2,"0")).join("").slice(0,10);
 return "wedding-"+token;
}

function newUniqueSlug(){
 $("slug").value=makeSlug();
}

function selectDoor(id){
 id=Number(id);
 if(!doorNames[id])id=1;
 $("template").value=String(id);
 $("doorDescription").textContent=
  "القالب "+id+" — "+doorNames[id]+": "+doorDescriptions[id];

 document.querySelectorAll(".door-option").forEach(button=>{
  const selected=Number(button.dataset.id)===id;
  button.classList.toggle("selected",selected);
  button.setAttribute("aria-pressed",String(selected));
 });
}

document.querySelectorAll(".door-option").forEach(button=>{
 button.addEventListener("click",()=>selectDoor(button.dataset.id));
});

function showSession(session){
 $("login").classList.toggle("hidden",!!session);
 $("panel").classList.toggle("hidden",!session);
 if(session)loadInvitations();
}

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  return status("اكتب البريد الإلكتروني وكلمة المرور أولاً.");
 }

 $("loginBtn").disabled=true;
 try{
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)return status("تعذر الدخول: "+error.message);
  status("تم تسجيل الدخول.");
 }catch(e){
  status("تعذر الاتصال. حاول مرة أخرى.");
 }finally{
  $("loginBtn").disabled=false;
 }
};

db.auth.onAuthStateChange((_event,session)=>showSession(session));

function invitationUrl(slug){
 const base=location.origin+location.pathname.replace(/admin\.html$/,"");
 const url=new URL(base);
 url.searchParams.set("invite",slug);
 return url.href;
}

async function copyText(text){
 if(navigator.clipboard&&window.isSecureContext){
  await navigator.clipboard.writeText(text);
  return;
 }
 const field=document.createElement("textarea");
 field.value=text;
 field.style.position="fixed";
 field.style.opacity="0";
 document.body.appendChild(field);
 field.select();
 const ok=document.execCommand("copy");
 field.remove();
 if(!ok)throw new Error("copy failed");
}

async function loadInvitations(){
 const {data,error}=await db.from("invitations")
  .select("*").order("created_at",{ascending:false});

 if(error)return status("تعذر تحميل الدعوات: "+error.message);
 $("list").replaceChildren();

 for(const item of data||[]){
  const card=document.createElement("div");
  card.className="item";

  const title=document.createElement("strong");
  title.textContent=(item.groom_name||"")+" و "+(item.bride_name||"");

  const details=document.createElement("p");
  details.style.whiteSpace="pre-line";
  details.textContent=
   "رمز الدعوة: "+item.slug+
   "\nالقالب: "+(item.template_id||1)+" — "+(doorNames[item.template_id]||doorNames[1])+
   "\nالتاريخ: "+(item.wedding_date||"غير محدد")+
   "\nالوقت: "+(item.wedding_time||"غير محدد")+
   "\nالمكان: "+(item.venue_name||"غير محدد")+
   "\nالصوت: "+(audioNames[item.audio_type]||audioNames.none)+
   "\nالملاحظات: "+(item.notes||"لا توجد");

  const url=invitationUrl(item.slug);
  const link=document.createElement("a");
  link.href=url;
  link.target="_blank";
  link.rel="noopener noreferrer";
  link.textContent="فتح رابط الدعوة";

  const copyButton=document.createElement("button");
  copyButton.type="button";
  copyButton.textContent="نسخ رابط الدعوة 📋";
  copyButton.onclick=async()=>{
   try{
    await copyText(url);
    status("تم نسخ رابط الدعوة:\n"+url);
    copyButton.textContent="تم النسخ ✓";
   }catch(e){
    status("تعذر النسخ. انسخ الرابط من هنا:\n"+url);
   }
  };

  const publication=document.createElement("p");
  publication.className=item.is_published?"published":"unpublished";
  publication.textContent=item.is_published?"منشورة":"غير منشورة";

  const edit=document.createElement("button");
  edit.type="button";
  edit.textContent="تعديل الدعوة";
  edit.onclick=()=>fillForm(item);

  card.append(title,details,link,copyButton,publication,edit);
  $("list").appendChild(card);
 }
 status("تم تحديث قائمة الدعوات.");
}

function fillForm(item){
 editingId=item.id;
 $("formTitle").textContent="تعديل الدعوة";
 $("slug").value=item.slug||"";
 $("groom").value=item.groom_name||"";
 $("bride").value=item.bride_name||"";
 $("date").value=item.wedding_date||"";
 $("day").value=item.day_name||"";
 $("time").value=item.wedding_time||"";
 $("venue").value=item.venue_name||"";
 $("map").value=item.map_url||"";
 $("phone").value=item.contact_phone||"";
 $("notes").value=item.notes||"";
 $("audioType").value=item.audio_type||"none";
 $("published").checked=!!item.is_published;
 selectDoor(item.template_id||1);
 status("عدّل البيانات ثم اضغط حفظ الدعوة. رابط الدعوة سيبقى نفسه.");
 window.scrollTo({top:0,behavior:"smooth"});
}

$("inviteForm").onsubmit=async event=>{
 event.preventDefault();
 if(busy)return;

 const record={
  slug:$("slug").value.trim(),
  groom_name:$("groom").value.trim(),
  bride_name:$("bride").value.trim(),
  wedding_date:$("date").value||null,
  day_name:$("day").value.trim(),
  wedding_time:$("time").value.trim(),
  venue_name:$("venue").value.trim(),
  map_url:$("map").value.trim(),
  contact_phone:$("phone").value.trim(),
  notes:$("notes").value.trim(),
  audio_type:$("audioType").value,
  audio_url:null,
  template_id:Number($("template").value),
  is_published:$("published").checked
 };

 if(!record.slug){
  return status("تعذر إنشاء رمز الدعوة. اضغط دعوة جديدة وحاول مرة أخرى.");
 }
 if(!record.groom_name||!record.bride_name){
  return status("اكتب اسم العريس واسم العروس.");
 }
 if(!Number.isInteger(record.template_id)||record.template_id<1||record.template_id>14){
  return status("اختار قالباً من القوالب الأربعة عشر.");
 }

 busy=true;
 $("saveBtn").disabled=true;
 status("جارٍ حفظ الدعوة...");
 let result;

 try{
  if(editingId){
   result=await db.from("invitations").update(record).eq("id",editingId);
  }else{
   result=await db.from("invitations").insert(record);
  }
 }catch(e){
  busy=false;
  $("saveBtn").disabled=false;
  return status("حدث خطأ أثناء الحفظ. حاول مرة أخرى.");
 }

 busy=false;
 $("saveBtn").disabled=false;

 if(result.error){
  if(!editingId&&/duplicate|unique/i.test(result.error.message)){
   newUniqueSlug();
   return status("تعارض رمز الرابط، تم توليد رمز جديد. اضغط حفظ الدعوة مرة أخرى.");
  }
  return status("لم يتم الحفظ: "+result.error.message);
 }

 const savedUrl=invitationUrl(record.slug);
 status("تم حفظ الدعوة بنجاح.\nرابط الدعوة:\n"+savedUrl);
 resetForm();
 await loadInvitations();
};

function resetForm(){
 $("inviteForm").reset();
 editingId=null;
 $("formTitle").textContent="إضافة دعوة جديدة";
 newUniqueSlug();
 selectDoor(1);
 $("audioType").value="none";
 $("notes").value="";
}

$("newBtn").onclick=()=>{
 resetForm();
 status("تم إنشاء رمز رابط جديد. أدخل بيانات الدعوة واحفظها.");
 window.scrollTo({top:0,behavior:"smooth"});
};

$("refreshBtn").onclick=loadInvitations;

$("logoutBtn").onclick=async()=>{
 const {error}=await db.auth.signOut();
 if(error)return status("تعذر تسجيل الخروج: "+error.message);
 status("تم تسجيل الخروج.");
};

selectDoor(1);
newUniqueSlug();

db.auth.getSession().then(({data,error})=>{
 if(error)return status("تعذر التحقق من جلسة الدخول.");
 showSession(data.session);
});
</script>
</body>
</html>

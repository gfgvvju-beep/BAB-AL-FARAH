<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="دعوة إلكترونية مميزة من باب الفرح">
<title>دعوة مميزة | باب الفرح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#dfbd76}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Cairo,sans-serif}
body{overflow:hidden}
button,a{font:inherit}
#app{position:fixed;inset:0;width:100%;height:100dvh;background:#050505;overflow:hidden}
.screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#050505}
.hidden{display:none!important}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.shade{position:absolute;inset:0;pointer-events:none}
button{cursor:pointer}
#loading,#errorScreen{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.gold{color:var(--g)}
.loader{width:38px;height:38px;border:3px solid #55462b;border-top-color:var(--g);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
#errorScreen h2{color:var(--g)}
#errorScreen p{line-height:2;overflow-wrap:anywhere}
#errorScreen a{color:var(--g)}
#doorScreen{background:radial-gradient(ellipse at center,#302314,#090807 72%)}
#doorVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}
#doorFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.door-frame{position:relative;width:min(76vw,470px);height:min(77vh,720px);border:5px solid #8c6935;box-shadow:0 0 0 8px #241a0d,0 0 55px #000;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#291c12,#5c3b20 15%,#25170e 50%,#5a3920 86%,#20140b)}
.door-panels{position:absolute;inset:12px;display:flex;gap:9px}
.door-panel{position:relative;flex:1;border:2px solid #a17a42;background:linear-gradient(90deg,#21150d,#4b2d18 22%,#29180e 50%,#56371e 78%,#24160d);box-shadow:inset 0 0 25px #000}
.door-panel:before,.door-panel:after{content:"";position:absolute;left:10%;right:10%;border:2px solid #926b38;height:34%;top:8%;box-shadow:inset 0 0 18px #000}
.door-panel:after{top:49%;height:40%}
.door-handle{position:absolute;top:49%;right:9%;width:13px;height:13px;border-radius:50%;background:#e2bf6f;box-shadow:0 0 10px #d5a64d}
.door-title{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:Amiri,serif;color:#f1d393;font-size:clamp(25px,5vw,42px);text-shadow:0 3px 15px #000}
.door-instruction{position:absolute;bottom:7%;left:12px;right:12px;text-align:center;color:#f9e9c7;font-size:clamp(12px,3vw,17px);line-height:2}
.tap-ring{width:56px;height:56px;border:1px solid var(--g);border-radius:50%;margin:12px auto 0;display:flex;align-items:center;justify-content:center;font-size:24px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 12px #d8b56800}}
#doorTap{position:absolute;inset:0;z-index:5;background:transparent;border:0;color:white}
#knockCounter{position:absolute;z-index:6;top:20px;left:20px;border:1px solid #d8b56888;border-radius:30px;padding:8px 14px;background:#0008;color:#f6d88b;font-size:12px;pointer-events:none}
#invitationScreen{background:#080706}
#invitationShade{background:linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,.15))}
.ptext{position:absolute;z-index:3;transform:translate(-50%,-50%);width:max-content;max-width:92%;overflow-wrap:anywhere;text-align:center;text-shadow:0 2px 8px #000,0 1px 3px #000;white-space:pre-line}
#invitationBadge{font-size:11px;border:1px solid var(--g);border-radius:30px;padding:6px 14px;color:#f8e1aa;background:#0002}
#invitationGreeting{font-family:"Aref Ruqaa",serif;font-size:clamp(22px,5vw,38px);line-height:1.6}
#invitationNames{font-family:Amiri,serif;font-size:clamp(30px,7vw,56px);line-height:1.4;color:#f5d38b}
#invitationText,#invitationDetails{font-size:clamp(12px,2.7vw,18px);line-height:1.8}
#invitationLinks{font-size:12px;text-shadow:0 2px 7px #000}
.link-button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border:1px solid var(--g);border-radius:28px;padding:8px 12px;background:#100d09d9;font-size:12px;margin:3px}
#musicButton,#restartButton{position:absolute;z-index:8;top:15px;border:1px solid var(--g);background:#080808b8;color:#f4d18b}
#musicButton{right:15px;border-radius:50%;width:43px;height:43px;font-size:18px}
#restartButton{left:15px;border-radius:30px;padding:9px 13px;font-size:11px}
#celebration{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s}
#celebration.active{opacity:1}
#celebration span{font-size:clamp(25px,7vw,48px);color:#f8d98f;text-shadow:0 0 22px #b9872d;text-align:center;padding:20px;font-family:Amiri,serif}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;width:7px;height:12px;background:#e7c46e;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(max-height:620px){#invitationGreeting{font-size:clamp(17px,4vh,28px)}#invitationNames{font-size:clamp(24px,6vh,40px)}#invitationText,#invitationDetails{font-size:12px;line-height:1.5}.door-frame{height:70vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <section id="loading" class="screen"><div><div class="loader"></div><div class="gold">جارٍ تجهيز دعوتكم...</div></div></section>
 <section id="errorScreen" class="screen hidden"><div><h2>تعذّر فتح الدعوة</h2><p id="errorMessage">تأكد من الرابط وحاول مرة أخرى.</p><a href="./">العودة إلى باب الفرح</a></div></section>
 <section id="doorScreen" class="screen hidden">
  <video id="doorVideo" class="hidden" playsinline muted preload="auto"></video>
  <div id="doorFallback"><div class="door-frame">
   <div class="door-title">باب الفرح</div>
   <div class="door-panels"><div class="door-panel"></div><div class="door-panel"><div class="door-handle"></div></div></div>
   <div class="door-instruction"><div id="doorInstruction">اطرق الباب ثلاث مرات لفتح دعوتكم</div><div class="tap-ring">⌁</div><div id="knockText">الطرقات: ٠ من ٣</div></div>
  </div></div>
  <div id="knockCounter">الطرقات: ٠ / ٣</div>
  <button id="doorTap" aria-label="انقر لطرق الباب ثلاث مرات"></button>
 </section>
 <section id="invitationScreen" class="screen hidden">
  <img id="invitationMedia" class="media" alt="">
  <video id="invitationVideo" class="media hidden" playsinline muted loop preload="metadata"></video>
  <div id="invitationShade" class="shade"></div>
  <button id="musicButton" class="hidden" aria-label="تشغيل أو إيقاف الموسيقى">♫</button>
  <button id="restartButton" type="button">↻ إعادة المشاهدة</button>
  <div id="invitationBadge" class="ptext" data-position="badge">دعوة مميزة</div>
  <div id="invitationGreeting" class="ptext" data-position="greeting"></div>
  <div id="invitationNames" class="ptext" data-position="names"></div>
  <div id="invitationText" class="ptext" data-position="body"></div>
  <div id="invitationDetails" class="ptext" data-position="details"></div>
  <div id="invitationLinks" class="ptext" data-position="links"></div>
  <audio id="invitationMusic" preload="none" loop></audio>
  <div id="confetti"></div>
 </section>
 <div id="celebration" class="hidden"><span>أهلاً وسهلاً بكم<br>نورتونا بحضوركم ♡</span></div>
</div>
<script>
(()=>{'use strict';
const db=supabase.createClient('https://gnsnbretccdlwpmimuap.supabase.co','sb_publishable_-YuiIyffuaJ9TkLO_bxesA_rbFOqJKU');
const $=id=>document.getElementById(id);
const screens=['loading','errorScreen','doorScreen','invitationScreen'];
const defaults={badge:{x:50,y:15},greeting:{x:50,y:29},names:{x:50,y:42},body:{x:50,y:55},details:{x:50,y:68},links:{x:50,y:86}};
let inv=null,knocks=0,opened=false,doorTimer=null,celebrationTimer=null,musicUrl='';
function show(id){screens.forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function safeUrl(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}}
function error(s){$('errorMessage').textContent=s;show('errorScreen')}
function txt(id,v){$(id).textContent=typeof v==='string'?v:''}
function stopVideo(v){try{v.pause()}catch{}v.removeAttribute('src');v.load()}
function stopMedia(){clearTimeout(doorTimer);try{$('invitationMusic').pause()}catch{}stopVideo($('doorVideo'));stopVideo($('invitationVideo'))}
function setupDoor(){
 const v=$('doorVideo'),u=safeUrl(inv?.door_video_url);
 if(!u){v.classList.add('hidden');$('doorFallback').classList.remove('hidden');return}
 $('doorFallback').classList.add('hidden');v.classList.remove('hidden');v.src=u;v.loop=true;v.muted=true;v.playsInline=true;
 v.play().catch(()=>{v.classList.add('hidden');$('doorFallback').classList.remove('hidden')});
}
function reset(){
 stopMedia();opened=false;knocks=0;
 $('knockCounter').textContent='الطرقات: ٠ / ٣';$('knockText').textContent='الطرقات: ٠ من ٣';
 $('doorInstruction').textContent='اطرق الباب ثلاث مرات لفتح دعوتكم';
 $('confetti').replaceChildren();$('celebration').classList.add('hidden');$('celebration').classList.remove('active');
 show('doorScreen');setupDoor();
}
function knock(){
 if(opened)return;
 knocks++;
 const n=['٠','١','٢','٣'][Math.min(knocks,3)];
 $('knockCounter').textContent='الطرقات: '+n+' / ٣';$('knockText').textContent='الطرقات: '+n+' من ٣';
 if(navigator.vibrate)try{navigator.vibrate(35)}catch{}
 $('doorInstruction').textContent=knocks>=3?'تفضّلوا... أهلاً بكم':knocks===2?'طرقة أخيرة لفتح الباب':'أحسنتم، أكملوا الطرق';
 if(knocks>=3){opened=true;$('doorInstruction').textContent='جارٍ فتح الباب...';doorTimer=setTimeout(showInvitation,350)}
}
function setBackground(){
 const u=safeUrl(inv?.scene_one_url),type=inv?.scene_one_type||'image';
 const img=$('invitationMedia'),v=$('invitationVideo');
 if(type==='video'&&u){
  img.classList.add('hidden');v.classList.remove('hidden');v.src=u;v.muted=true;v.loop=true;v.playsInline=true;
  v.play().catch(()=>{});
 }else{
  stopVideo(v);v.classList.add('hidden');img.classList.remove('hidden');
  if(u)img.src=u;else img.removeAttribute('src');
 }
}
function details(){
 const parts=[inv.event_date,inv.event_time,inv.event_location].filter(v=>typeof v==='string'&&v.trim());
 txt('invitationDetails',parts.join('\n'));
 if(safeUrl(inv.map_url))txt('invitationDetails',(parts.length?parts.join('\n')+'\n':'')+'⌖ موقع المناسبة');
}
function links(){
 const box=$('invitationLinks');box.replaceChildren();const s=inv.social_links||{};
 function add(label,href){if(!href)return;const a=document.createElement('a');a.className='link-button';a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;box.append(a)}
 add('◉ واتساب',safeUrl(s.whatsapp));
 const phone=String(s.phone||'').replace(/[^\d+]/g,'');
 if(phone){const a=document.createElement('a');a.className='link-button';a.href='tel:'+phone;a.textContent='☎ اتصال';box.append(a)}
 add('◎ إنستغرام',safeUrl(s.instagram));
 if(!box.children.length)box.classList.add('hidden');else box.classList.remove('hidden');
}
function applyDesign(){
 const d=inv.design||{},p={...JSON.parse(JSON.stringify(defaults)),...(d.positions||{})};
 Object.keys(defaults).forEach(k=>p[k]={...defaults[k],...(d.positions?.[k]||{})});
 const font=['Amiri','Aref Ruqaa','Cairo','Reem Kufi'].includes(d.fontFamily)?d.fontFamily:'Amiri';
 $('invitationScreen').style.fontFamily='"'+font+'",serif';
 Object.keys(defaults).forEach(k=>{
  const el=document.querySelector('[data-position="'+k+'"]');
  el.style.left=Math.min(95,Math.max(5,Number(p[k].x)||50))+'%';
  el.style.top=Math.min(95,Math.max(5,Number(p[k].y)||50))+'%';
  el.style.textAlign=['left','right','center'].includes(d.textAlign)?d.textAlign:'center';
 });
 const color=/^#[0-9a-f]{6}$/i.test(d.textColor||'')?d.textColor:'#fff';
 const nameColor=/^#[0-9a-f]{6}$/i.test(d.nameColor||'')?d.nameColor:'#f5d38b';
 $('invitationGreeting').style.fontFamily='"'+font+'",serif';
 $('invitationNames').style.fontFamily='"'+font+'",serif';
 $('invitationGreeting').style.color=color;$('invitationText').style.color=color;$('invitationDetails').style.color=color;
 $('invitationNames').style.color=nameColor;
 $('invitationGreeting').style.fontSize=Math.min(42,Math.max(14,Number(d.greetingSize)||24))+'px';
 $('invitationNames').style.fontSize=Math.min(56,Math.max(18,Number(d.nameSize)||29))+'px';
 $('invitationText').style.fontSize=Math.min(25,Math.max(10,Number(d.detailsSize)||13))+'px';
 $('invitationDetails').style.fontSize=Math.min(25,Math.max(10,Number(d.detailsSize)||13))+'px';
 $('invitationBadge').classList.toggle('hidden',d.showBadge===false);
 const shade=Math.min(85,Math.max(0,Number(d.overlay)||0))/100;
 $('invitationShade').style.background='linear-gradient(0deg,rgba(0,0,0,'+shade+'),rgba(0,0,0,'+(shade/2)+'))';
}
function render(){
 document.title=(inv.title||'دعوة مميزة')+' | باب الفرح';
 txt('invitationBadge',inv.title||'دعوة مميزة');txt('invitationGreeting',inv.greeting);
 txt('invitationNames',inv.host_names);txt('invitationText',inv.invitation_text);
 details();links();applyDesign();setBackground();
}
async function playMusic(){
 if(!musicUrl)return;const a=$('invitationMusic');
 if(a.src!==musicUrl)a.src=musicUrl;
 try{await a.play();$('musicButton').textContent='♫';$('musicButton').title='إيقاف الموسيقى'}
 catch{$('musicButton').textContent='▶';$('musicButton').title='اضغط لتشغيل الموسيقى'}
}
function confetti(){
 const box=$('confetti');box.replaceChildren();
 for(let i=0;i<32;i++){
  const p=document.createElement('i');p.className='confetti-piece';p.style.left=Math.random()*100+'%';
  p.style.animationDelay=Math.random()*1.8+'s';p.style.animationDuration=(2.5+Math.random()*2)+'s';
  p.style.background=['#dfbd76','#fff0c4','#a87a37','#fff'][i%4];box.append(p);
 }
 const c=$('celebration');c.classList.remove('hidden');requestAnimationFrame(()=>c.classList.add('active'));
 clearTimeout(celebrationTimer);celebrationTimer=setTimeout(()=>{c.classList.remove('active');setTimeout(()=>c.classList.add('hidden'),850)},2600);
}
async function showInvitation(){
 clearTimeout(doorTimer);try{$('doorVideo').pause()}catch{}
 show('invitationScreen');render();
 musicUrl=safeUrl(inv.music_url);
 if(musicUrl){$('musicButton').classList.remove('hidden');await playMusic()}
 else{$('musicButton').classList.add('hidden');$('invitationMusic').removeAttribute('src')}
 confetti();
}
async function load(){
 const slug=(new URLSearchParams(location.search).get('slug')||'').trim();
 if(!slug)return error('الرابط لا يحتوي على رمز الدعوة. افتح الرابط الخاص الذي وصلك من صاحب الدعوة.');
 try{
  const {data,error:e}=await db.from('premium_invitations')
   .select('slug,title,event_type,is_published,host_names,greeting,invitation_text,event_date,event_time,event_location,map_url,door_video_url,scene_one_url,scene_one_type,music_url,design,social_links')
   .eq('slug',slug).eq('is_published',true).maybeSingle();
  if(e)throw e;
  if(!data)return error('الدعوة غير موجودة أو لم تُنشر بعد. تأكد من الرابط مع صاحب الدعوة.');
  inv=data;show('doorScreen');setupDoor();
 }catch(e){console.error(e);error('تعذّر تحميل الدعوة. تأكد من إعدادات قاعدة البيانات والصلاحيات ثم أعد المحاولة.')}
}
$('doorTap').addEventListener('click',knock);
$('musicButton').addEventListener('click',async()=>{
 const a=$('invitationMusic');if(!musicUrl)return;
 if(a.paused)await playMusic();else{a.pause();$('musicButton').textContent='▶';$('musicButton').title='تشغيل الموسيقى'}
});
$('restartButton').addEventListener('click',reset);
window.addEventListener('pagehide',stopMedia);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stopMedia()});
load();
})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="دعوة إلكترونية مميزة من باب الفرح">
<title>دعوة مميزة | باب الفرح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#dfbd76;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:white;font-family:Cairo,sans-serif}
body{overflow:hidden}
button,a{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#050505;overflow:hidden}
.screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#050505}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.64),rgba(0,0,0,.12) 55%,rgba(0,0,0,.4));pointer-events:none}
.hidden{display:none!important}
#loading,#errorScreen{display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.loader{width:38px;height:38px;border:3px solid #55462b;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.gold{color:var(--gold)}
#doorScreen{background:radial-gradient(ellipse at center,#302314,#090807 72%)}
#doorFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.door-frame{position:relative;width:min(76vw,470px);height:min(77vh,720px);border:5px solid #8c6935;box-shadow:0 0 0 8px #241a0d,0 0 55px #000;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#291c12,#5c3b20 15%,#25170e 50%,#5a3920 86%,#20140b)}
.door-panels{position:absolute;inset:12px;display:flex;gap:9px}
.door-panel{position:relative;flex:1;border:2px solid #a17a42;background:linear-gradient(90deg,#21150d,#4b2d18 22%,#29180e 50%,#56371e 78%,#24160d);box-shadow:inset 0 0 25px #000}
.door-panel:before,.door-panel:after{content:"";position:absolute;left:10%;right:10%;border:2px solid #926b38;height:34%;top:8%;box-shadow:inset 0 0 18px #000}
.door-panel:after{top:49%;height:40%}
.door-handle{position:absolute;top:49%;right:9%;width:13px;height:13px;border-radius:50%;background:#e2bf6f;box-shadow:0 0 10px #d5a64d}
.door-title{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:Amiri,serif;color:#f1d393;font-size:clamp(25px,5vw,42px);text-shadow:0 3px 15px #000}
.door-instruction{position:absolute;bottom:7%;left:12px;right:12px;text-align:center;color:#f9e9c7;font-size:clamp(12px,3vw,17px);line-height:2}
.tap-ring{width:56px;height:56px;border:1px solid var(--gold);border-radius:50%;margin:12px auto 0;display:flex;align-items:center;justify-content:center;font-size:24px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #d8b56833}50%{transform:scale(1.06);box-shadow:0 0 0 12px #d8b56800}}
#doorVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}
#doorTap{position:absolute;inset:0;z-index:5;background:transparent;border:0;color:white}
#knockCounter{position:absolute;z-index:6;top:20px;left:20px;border:1px solid #d8b56888;border-radius:30px;padding:8px 14px;background:#0008;color:#f6d88b;font-size:12px;pointer-events:none}
#sceneScreen{background:#050505}
#sceneScreen .shade{background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.05) 70%,rgba(0,0,0,.2))}
.scene-progress{position:absolute;z-index:3;top:15px;left:0;right:0;display:flex;gap:6px;padding:0 15px}
.progress-segment{height:3px;flex:1;border-radius:10px;background:#ffffff55;overflow:hidden}
.progress-segment span{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.scene-label{position:absolute;z-index:3;bottom:20px;left:0;right:0;text-align:center;color:#f9e8c1;font-size:12px;text-shadow:0 2px 7px #000}
#sceneTap{position:absolute;inset:0;border:0;background:transparent;z-index:2}
#invitationScreen{background:#080706}
#invitationMedia{transition:opacity .45s}
#invitationShade{background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,.18) 60%,rgba(0,0,0,.32))}
#invitationCopy{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(18px,5vw,60px);gap:clamp(10px,2.4vh,23px);overflow-y:auto;overscroll-behavior:contain}
#invitationCopy>*{max-width:100%;overflow-wrap:anywhere;text-shadow:0 2px 8px #000,0 1px 3px #000}
#invitationBadge{font-size:11px;letter-spacing:.5px;border:1px solid #dfbd76;border-radius:30px;padding:6px 16px;color:#f8e1aa;background:#0002}
#invitationGreeting{font-family:"Aref Ruqaa",serif;font-size:clamp(22px,5vw,38px);line-height:1.7}
#invitationNames{font-family:Amiri,serif;font-size:clamp(30px,7vw,56px);line-height:1.5;color:#f5d38b}
#invitationText{font-size:clamp(13px,2.7vw,18px);line-height:2;white-space:pre-line}
#invitationDetails{font-size:clamp(13px,2.7vw,17px);line-height:2.2;white-space:pre-line}
.detail-line{margin:3px 0}
.link-buttons{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;padding-top:4px}
.link-button{min-width:86px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:#fff;border:1px solid #dfbd76;border-radius:28px;padding:9px 14px;background:#100d09b8;font-size:12px}
.link-button:active{transform:scale(.97)}
#musicButton{position:absolute;z-index:8;top:15px;right:15px;border:1px solid #dfbd76;border-radius:50%;width:43px;height:43px;background:#080808a8;color:#f4d18b;font-size:18px}
#restartButton{position:absolute;z-index:8;top:15px;left:15px;border:1px solid #dfbd76;border-radius:30px;padding:9px 13px;background:#080808a8;color:#f4d18b;font-size:11px}
#celebration{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s;background:#0000}
#celebration.active{opacity:1}
#celebration span{font-size:clamp(25px,7vw,48px);color:#f8d98f;text-shadow:0 0 22px #b9872d;text-align:center;padding:20px;font-family:Amiri,serif}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;width:7px;height:12px;background:#e7c46e;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
#errorScreen h2{color:#e8c579}
#errorScreen p{line-height:2;color:#ddd;overflow-wrap:anywhere}
#errorScreen a{color:#e8c579}
@media(orientation:landscape) and (min-width:700px){
 .door-frame{height:min(82vh,650px);width:min(50vw,520px)}
 #invitationCopy{gap:10px;padding:20px 9vw}
 #invitationGreeting{font-size:clamp(20px,3vw,32px)}
 #invitationNames{font-size:clamp(27px,4vw,44px)}
 #invitationText,#invitationDetails{font-size:clamp(12px,1.5vw,16px);line-height:1.7}
}
@media(max-height:620px){
 #invitationCopy{gap:7px;padding:55px 16px 18px}
 #invitationGreeting{font-size:clamp(19px,4vh,28px)}
 #invitationNames{font-size:clamp(25px,6vh,40px)}
 #invitationText,#invitationDetails{font-size:12px;line-height:1.6}
 .door-frame{height:70vh}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <section id="loading" class="screen">
    <div><div class="loader"></div><div class="gold">جارٍ تجهيز دعوتكم...</div></div>
  </section>

  <section id="errorScreen" class="screen hidden">
    <div>
      <h2>تعذّر فتح الدعوة</h2>
      <p id="errorMessage">تأكد من الرابط وحاول مرة أخرى.</p>
      <a href="./">العودة إلى باب الفرح</a>
    </div>
  </section>

  <section id="doorScreen" class="screen hidden">
    <video id="doorVideo" class="hidden" playsinline muted preload="auto"></video>
    <div id="doorFallback">
      <div class="door-frame">
        <div class="door-title">باب الفرح</div>
        <div class="door-panels">
          <div class="door-panel"></div>
          <div class="door-panel"><div class="door-handle"></div></div>
        </div>
        <div class="door-instruction">
          <div id="doorInstruction">اطرق الباب ثلاث مرات لفتح دعوتكم</div>
          <div class="tap-ring">⌁</div>
          <div id="knockText">الطرقات: ٠ من ٣</div>
        </div>
      </div>
    </div>
    <div id="knockCounter">الطرقات: ٠ / ٣</div>
    <button id="doorTap" aria-label="انقر لطرق الباب ثلاث مرات"></button>
  </section>

  <section id="sceneScreen" class="screen hidden">
    <img id="sceneImage" class="media" alt="" />
    <video id="sceneVideo" class="media hidden" playsinline muted preload="auto"></video>
    <div class="shade"></div>
    <div class="scene-progress">
      <div class="progress-segment"><span id="progressOne"></span></div>
      <div class="progress-segment"><span id="progressTwo"></span></div>
    </div>
    <div id="sceneLabel" class="scene-label">لحظات من الفرح</div>
    <button id="sceneTap" aria-label="الانتقال للمشهد التالي"></button>
  </section>

  <section id="invitationScreen" class="screen hidden">
    <img id="invitationMedia" class="media" alt="" />
    <video id="invitationVideo" class="media hidden" playsinline muted loop preload="metadata"></video>
    <div id="invitationShade" class="shade"></div>
    <button id="musicButton" aria-label="تشغيل أو إيقاف الموسيقى" title="الموسيقى">♫</button>
    <button id="restartButton" type="button">↻ إعادة المشاهدة</button>
    <div id="invitationCopy">
      <div id="invitationBadge">دعوة مميزة</div>
      <div id="invitationGreeting"></div>
      <div id="invitationNames"></div>
      <div id="invitationText"></div>
      <div id="invitationDetails"></div>
      <div id="invitationLinks" class="link-buttons"></div>
    </div>
    <audio id="invitationMusic" preload="none" loop></audio>
    <div id="confetti"></div>
  </section>
  <div id="celebration" class="hidden"><span>أهلاً وسهلاً بكم<br>نورتونا بحضوركم ♡</span></div>
</div>

<script>
(() => {
'use strict';

const SUPABASE_URL = 'https://gnsnbretccdlwpmimuap.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-YuiIyffuaJ9TkLO_bxesA_rbFOqJKU';
const {createClient} = supabase;
const db = createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const screens = ['loading','errorScreen','doorScreen','sceneScreen','invitationScreen'];
let invitation = null;
let knockCount = 0;
let sceneIndex = 0;
let started = false;
let doorTimeout = null;
let sceneTimer = null;
let activeObjectUrls = [];
let celebrationTimer = null;
let currentMusicUrl = '';

function showScreen(id) {
  screens.forEach(name => $(name).classList.toggle('hidden',name !== id));
}
function safeUrl(value) {
  if (!value) return '';
  try {
    const u = new URL(value);
    return ['https:','http:'].includes(u.protocol) ? u.href : '';
  } catch { return ''; }
}
function showError(message) {
  $('errorMessage').textContent = message;
  showScreen('errorScreen');
}
function asText(value) { return typeof value === 'string' ? value : ''; }
function mediaType(url,declared) {
  if (declared === 'video' || declared === 'image') return declared;
  return /\.(mp4|webm|mov)(\?|#|$)/i.test(url || '') ? 'video' : 'image';
}
function stopVideo(video) {
  try { video.pause(); } catch {}
  video.removeAttribute('src');
  video.load();
}
function stopAllMedia() {
  clearTimeout(doorTimeout);
  clearTimeout(sceneTimer);
  try { $('invitationMusic').pause(); } catch {}
  stopVideo($('doorVideo'));
  stopVideo($('sceneVideo'));
  stopVideo($('invitationVideo'));
}
function resetMediaForReplay() {
  stopAllMedia();
  started = false;
  knockCount = 0;
  sceneIndex = 0;
  $('knockCounter').textContent = 'الطرقات: ٠ / ٣';
  $('knockText').textContent = 'الطرقات: ٠ من ٣';
  $('doorInstruction').textContent = 'اطرق الباب ثلاث مرات لفتح دعوتكم';
  $('progressOne').style.width = '0%';
  $('progressTwo').style.width = '0%';
  $('confetti').replaceChildren();
  $('celebration').classList.add('hidden');
  $('celebration').classList.remove('active');
  showScreen('doorScreen');
  setupDoorVideo();
}
function setupDoorVideo() {
  const url = safeUrl(invitation?.door_video_url);
  if (!url) {
    $('doorVideo').classList.add('hidden');
    $('doorFallback').classList.remove('hidden');
    return;
  }
  const video = $('doorVideo');
  video.classList.remove('hidden');
  $('doorFallback').classList.add('hidden');
  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  video.play().catch(() => {
    $('doorFallback').classList.remove('hidden');
    video.classList.add('hidden');
  });
}
function handleKnock() {
  if (started) return;
  knockCount++;
  const shown = ['٠','١','٢','٣'][Math.min(knockCount,3)];
  $('knockCounter').textContent = 'الطرقات: ' + shown + ' / ٣';
  $('knockText').textContent = 'الطرقات: ' + shown + ' من ٣';
  if (navigator.vibrate) {
    try { navigator.vibrate(35); } catch {}
  }
  $('doorInstruction').textContent =
    knockCount >= 3 ? 'تفضّلوا... أهلاً بكم' :
    knockCount === 2 ? 'طرقة أخيرة لفتح الباب' : 'أحسنتم، أكملوا الطرق';
  if (knockCount >= 3) {
    started = true;
    $('doorInstruction').textContent = 'جارٍ فتح الباب...';
    doorTimeout = setTimeout(beginScenes,450);
  }
}
function getScenes() {
  const one = safeUrl(invitation?.scene_one_url);
  const two = safeUrl(invitation?.scene_two_url);
  return [
    one ? {url:one,type:mediaType(one,invitation.scene_one_type)} : null,
    two ? {url:two,type:mediaType(two,invitation.scene_two_type)} : null
  ].filter(Boolean);
}
function beginScenes() {
  clearTimeout(doorTimeout);
  const scenes = getScenes();
  if (!scenes.length) {
    showInvitation();
    return;
  }
  sceneIndex = 0;
  showScreen('sceneScreen');
  displayScene(scenes);
}
function displayScene(scenes) {
  clearTimeout(sceneTimer);
  if (sceneIndex >= scenes.length) {
    showInvitation();
    return;
  }
  const scene = scenes[sceneIndex];
  $('progressOne').style.width = sceneIndex > 0 ? '100%' : '0%';
  $('progressTwo').style.width = '0%';
  $('sceneLabel').textContent = sceneIndex === 0 ? 'لحظات من الفرح' : 'فرحتكم تكمل فرحتنا';
  const img = $('sceneImage');
  const video = $('sceneVideo');
  if (scene.type === 'video') {
    img.classList.add('hidden');
    video.classList.remove('hidden');
    video.src = scene.url;
    video.muted = true;
    video.loop = false;
    video.playsInline = true;
    video.preload = 'auto';
    video.onended = () => nextScene();
    video.onerror = () => nextScene();
    video.play().catch(() => {
      sceneTimer = setTimeout(nextScene,5000);
    });
    sceneTimer = setTimeout(() => {
      if (!video.ended && !video.paused) nextScene();
    },12000);
  } else {
    stopVideo(video);
    video.classList.add('hidden');
    img.classList.remove('hidden');
    img.src = scene.url;
    img.onerror = () => nextScene();
    sceneTimer = setTimeout(nextScene,5000);
  }
}
function nextScene() {
  clearTimeout(sceneTimer);
  const scenes = getScenes();
  if (sceneIndex === 0) $('progressOne').style.width = '100%';
  else $('progressTwo').style.width = '100%';
  sceneIndex++;
  displayScene(scenes);
}
function setMediaBackground() {
  const one = safeUrl(invitation?.scene_one_url);
  const two = safeUrl(invitation?.scene_two_url);
  const chosen = two || one;
  const type = chosen ? mediaType(chosen,chosen === two ? invitation.scene_two_type : invitation.scene_one_type) : 'image';
  const img = $('invitationMedia');
  const video = $('invitationVideo');
  if (type === 'video' && chosen) {
    img.classList.add('hidden');
    video.classList.remove('hidden');
    video.src = chosen;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.play().catch(() => {});
  } else if (chosen) {
    stopVideo(video);
    video.classList.add('hidden');
    img.classList.remove('hidden');
    img.src = chosen;
  } else {
    stopVideo(video);
    video.classList.add('hidden');
    img.classList.remove('hidden');
    img.removeAttribute('src');
    $('invitationScreen').style.background = 'radial-gradient(ellipse at center,#45321d,#080706 80%)';
  }
}
function setText(id,value) {
  $(id).textContent = asText(value);
}
function buildDetails() {
  const details = $('invitationDetails');
  details.replaceChildren();
  const rows = [
    ['التاريخ',invitation.event_date],
    ['الوقت',invitation.event_time],
    ['المكان',invitation.event_location]
  ];
  rows.forEach(([label,value]) => {
    if (!asText(value).trim()) return;
    const line = document.createElement('div');
    line.className = 'detail-line';
    line.textContent = label + ': ' + value;
    details.appendChild(line);
  });
  const map = safeUrl(invitation.map_url);
  if (map) {
    const a = document.createElement('a');
    a.className = 'link-button';
    a.href = map;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '⌖ موقع المناسبة';
    details.appendChild(a);
  }
}
function addLink(container,label,href,symbol) {
  if (!href) return;
  const a = document.createElement('a');
  a.className = 'link-button';
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = symbol + ' ' + label;
  container.appendChild(a);
}
function renderLinks() {
  const box = $('invitationLinks');
  box.replaceChildren();
  const social = invitation.social_links || {};
  const whatsapp = safeUrl(social.whatsapp);
  const instagram = safeUrl(social.instagram);
  const phone = asText(social.phone).replace(/[^\d+]/g,'');
  addLink(box,'واتساب',whatsapp,'◉');
  if (phone) {
    const a = document.createElement('a');
    a.className = 'link-button';
    a.href = 'tel:' + phone;
    a.textContent = '☎ اتصال';
    box.appendChild(a);
  }
  addLink(box,'إنستغرام',instagram,'◎');
  if (!box.children.length) box.classList.add('hidden');
  else box.classList.remove('hidden');
}
function applyDesign() {
  const d = invitation.design || {};
  const font = ['Amiri','Aref Ruqaa','Cairo','Reem Kufi'].includes(d.fontFamily) ? d.fontFamily : 'Amiri';
  const textColor = /^#[0-9a-f]{6}$/i.test(d.textColor || '') ? d.textColor : '#ffffff';
  const nameColor = /^#[0-9a-f]{6}$/i.test(d.nameColor || '') ? d.nameColor : '#f5d38b';
  $('invitationCopy').style.fontFamily = '"' + font + '",serif';
  $('invitationCopy').style.textAlign = ['center','left','right'].includes(d.textAlign) ? d.textAlign : 'center';
  $('invitationCopy').style.justifyContent =
    d.textPosition === 'top' ? 'flex-start' :
    d.textPosition === 'bottom' ? 'flex-end' : 'center';
  if (d.textPosition === 'top') $('invitationCopy').style.paddingTop = '70px';
  if (d.textPosition === 'bottom') $('invitationCopy').style.paddingBottom = '65px';
  $('invitationGreeting').style.color = textColor;
  $('invitationText').style.color = textColor;
  $('invitationDetails').style.color = textColor;
  $('invitationNames').style.color = nameColor;
  if (Number.isFinite(Number(d.greetingSize))) {
    $('invitationGreeting').style.fontSize = 'clamp(18px,'+Math.min(42,Math.max(14,Number(d.greetingSize)))+'px,42px)';
  }
  if (Number.isFinite(Number(d.nameSize))) {
    $('invitationNames').style.fontSize = 'clamp(24px,'+Math.min(56,Math.max(18,Number(d.nameSize)))+'px,56px)';
  }
  if (Number.isFinite(Number(d.detailsSize))) {
    const size = Math.min(25,Math.max(10,Number(d.detailsSize)));
    $('invitationDetails').style.fontSize = size+'px';
    $('invitationText').style.fontSize = size+'px';
  }
  const shade = Math.min(85,Math.max(0,Number(d.overlay) || 35))/100;
  $('invitationShade').style.background =
    'linear-gradient(0deg,rgba(0,0,0,'+shade+'),rgba(0,0,0,'+(shade/2)+'))';
  $('invitationBadge').classList.toggle('hidden',d.showBadge === false);
}
function renderInvitation() {
  document.title = (invitation.title || 'دعوة مميزة') + ' | باب الفرح';
  setText('invitationBadge',invitation.title || 'دعوة مميزة');
  setText('invitationGreeting',invitation.greeting);
  setText('invitationNames',invitation.host_names);
  setText('invitationText',invitation.invitation_text);
  buildDetails();
  renderLinks();
  applyDesign();
  setMediaBackground();
}
async function tryPlayMusic() {
  const audio = $('invitationMusic');
  if (!currentMusicUrl) return;
  if (audio.src !== currentMusicUrl) {
    audio.src = currentMusicUrl;
    audio.loop = true;
  }
  try {
    await audio.play();
    $('musicButton').textContent = '♫';
    $('musicButton').title = 'إيقاف الموسيقى';
  } catch {
    $('musicButton').textContent = '▶';
    $('musicButton').title = 'اضغط لتشغيل الموسيقى';
  }
}
async function showInvitation() {
  clearTimeout(sceneTimer);
  stopVideo($('sceneVideo'));
  showScreen('invitationScreen');
  renderInvitation();
  const audioUrl = safeUrl(invitation.music_url);
  if (audioUrl) {
    currentMusicUrl = audioUrl;
    $('invitationMusic').src = audioUrl;
    $('invitationMusic').loop = true;
    await tryPlayMusic();
  } else {
    currentMusicUrl = '';
    $('musicButton').classList.add('hidden');
  }
  startCelebration();
}
function startCelebration() {
  const box = $('confetti');
  box.replaceChildren();
  for (let i=0;i<32;i++) {
    const piece = document.createElement('i');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.animationDelay = Math.random()*1.8+'s';
    piece.style.animationDuration = (2.5+Math.random()*2)+'s';
    piece.style.background = ['#dfbd76','#fff0c4','#a87a37','#ffffff'][i%4];
    box.appendChild(piece);
  }
  const c = $('celebration');
  c.classList.remove('hidden');
  requestAnimationFrame(() => c.classList.add('active'));
  clearTimeout(celebrationTimer);
  celebrationTimer = setTimeout(() => {
    c.classList.remove('active');
    setTimeout(() => c.classList.add('hidden'),850);
  },2600);
}
async function loadInvitation() {
  const params = new URLSearchParams(location.search);
  const slug = (params.get('slug') || '').trim();
  if (!slug) {
    showError('الرابط لا يحتوي على رمز الدعوة. افتح الرابط الخاص الذي وصلك من صاحب الدعوة.');
    return;
  }
  try {
    const {data,error} = await db.from('premium_invitations')
      .select('slug,title,event_type,is_published,host_names,greeting,invitation_text,event_date,event_time,event_location,map_url,door_video_url,scene_one_url,scene_one_type,scene_two_url,scene_two_type,music_url,design,social_links')
      .eq('slug',slug).eq('is_published',true).maybeSingle();
    if (error) throw error;
    if (!data) {
      showError('هذه الدعوة غير موجودة أو لم يتم نشرها بعد. تأكد من الرابط مع صاحب الدعوة.');
      return;
    }
    invitation = data;
    renderInvitation();
    showScreen('doorScreen');
    setupDoorVideo();
  } catch(e) {
    showError('تعذّر تحميل الدعوة. تأكد من إعدادات قاعدة البيانات والصلاحيات ثم أعد المحاولة.');
    console.error('Premium invitation load error:',e);
  }
}
$('doorTap').addEventListener('click',handleKnock);
$('sceneTap').addEventListener('click',nextScene);
$('musicButton').addEventListener('click',async () => {
  const audio = $('invitationMusic');
  if (!currentMusicUrl) return;
  if (audio.paused) await tryPlayMusic();
  else {
    audio.pause();
    $('musicButton').textContent = '▶';
    $('musicButton').title = 'تشغيل الموسيقى';
  }
});
$('restartButton').addEventListener('click',() => {
  resetMediaForReplay();
});
window.addEventListener('pagehide',stopAllMedia);
document.addEventListener('visibilitychange',() => {
  if (document.visibilityState === 'hidden') {
    try { $('invitationMusic').pause(); } catch {}
    try { $('doorVideo').pause(); } catch {}
    try { $('sceneVideo').pause(); } catch {}
    try { $('invitationVideo').pause(); } catch {}
  }
});
loadInvitation();
})();
</script>

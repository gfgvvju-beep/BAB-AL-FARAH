
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>باب الفرح | دعوة زفاف</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:25px 12px;
 display:flex;align-items:center;justify-content:center;
 font-family:Tahoma,Arial,sans-serif;text-align:center;
 color:#f8e7c0;
 background:radial-gradient(ellipse,#354333,#101710 80%);
}
main{width:100%;max-width:440px}
h1{color:#e5c27b;font-size:30px}
.subtitle{margin-bottom:28px}
.frame{
 position:relative;width:min(76vw,290px);
 height:min(105vw,390px);max-height:390px;
 margin:auto auto 22px;padding:10px;
 border:5px solid #bd9652;border-radius:100px 100px 4px 4px;
 background:#2b1b12;perspective:1000px;
 box-shadow:0 0 28px #000;
}
.inside{
 position:absolute;inset:12px;
 border-radius:80px 80px 0 0;
 background:radial-gradient(ellipse,#ffe6a0,#8d6b36 45%,#211c12);
 box-shadow:inset 0 0 40px #ffe6a0;
}
.door{
 position:absolute;z-index:2;inset:10px;
 transform-origin:right center;
 transition:transform 1.8s ease-in-out;
 border:5px solid #744528;border-radius:80px 80px 2px 2px;
 background:repeating-linear-gradient(90deg,#402315 0 12px,#74472a 17px,#50301c 27px);
 box-shadow:inset 0 0 25px #160b04;
}
.door:before{
 content:"";position:absolute;inset:20px;
 border:3px solid #c29a52;border-radius:65px 65px 0 0;
 box-shadow:inset 0 0 0 5px #3c2417;
}
.door:after{
 content:"";position:absolute;left:24%;bottom:20px;
 width:52%;height:28%;border:3px solid #bd914b;
}
.knob{
 position:absolute;right:16%;top:53%;width:17px;height:17px;
 border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff2a8,#b17a26);
}
.door.open{transform:rotateY(-105deg)}
button{
 padding:14px 24px;border:1px solid #f0d58d;border-radius:8px;
 background:linear-gradient(135deg,#f0d58d,#b28a43);
 color:#25190b;font:bold 17px Tahoma,Arial;cursor:pointer;
}
button:disabled{opacity:.7}
#hint{font-size:14px;color:#dfd0ae}
.invite{
 display:none;margin-top:25px;padding:25px 16px;
 border:1px solid #c8a65d;border-radius:14px;
 background:#192219;line-height:2;
}
.invite.show{display:block;animation:appear 1.4s ease}
.invite h2{color:#edce85;font-size:27px}
.names{font-size:25px;color:#fff0cb}
@keyframes appear{
 from{opacity:0;transform:translateY(18px)}
 to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main>
<h1>باب الفرح</h1>
<p class="subtitle">طرق الباب واكتشف دعوتك الخاصة ♥</p>

<div class="frame">
 <div class="inside"></div>
 <div class="door" id="door"><span class="knob"></span></div>
</div>

<button id="start">🔔 اطرق الباب وافتح الدعوة</button>
<p id="hint">ثلاث طرقات تفصلك عن فرحتنا</p>

<section class="invite" id="invite">
 <div>بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيم</div>
 <h2>دعوة زفاف</h2>
 <p>بكل الحب والسرور، نتشرف بدعوتكم لحضور حفل زفاف</p>
 <div class="names">
  <div id="groom">محمد</div>
  <div>♥</div>
  <div id="bride">نور</div>
 </div>
 <p>📅 التاريخ: <span id="date">يحدد لاحقاً</span></p>
 <p>🕗 الوقت: <span id="time">الثامنة مساءً</span></p>
 <p>📍 المكان: <span id="venue">قاعة الأفراح</span></p>
 <p>حضوركم يكتمل به فرحنا ❤️</p>
</section>
</main>

<script>
const door=document.getElementById("door");
const start=document.getElementById("start");
const hint=document.getElementById("hint");
const invite=document.getElementById("invite");
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

function knock(){
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="triangle";
  osc.frequency.value=100;
  gain.gain.setValueAtTime(.45,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+.18);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

start.addEventListener("click",async()=>{
 start.disabled=true;
 hint.textContent="دك... دك... دك...";
 for(let i=0;i<3;i++){
  door.animate([
   {translate:"0 0"},{translate:"-5px 0"},
   {translate:"4px 0"},{translate:"0 0"}
  ],{duration:230});
  knock();
  await wait(750);
 }
 door.classList.add("open");
 hint.textContent="أهلاً وسهلاً بكم";
 await wait(1500);
 invite.classList.add("show");
 invite.scrollIntoView({behavior:"smooth",block:"center"});
 start.textContent="تم فتح الدعوة ♥";
});
</script>
</body>
</html>

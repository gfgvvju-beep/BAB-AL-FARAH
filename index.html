.title{

  font-weight:bold;

}
.names{

<script>
const SUPABASE_URL="https://gnsnbretccdlwpmimuap.supabase.co";
const SUPABASE_KEY="sb_publishable_-YuiIyffuaJ9TkLO_bxesA_rbFOqJKU";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const SONG_URL="https://gfgvvju-beep.github.io/BAB-AL-FARAH/wedding-song.mp3";
const QURAN_URL="https://everyayah.com/data/Alafasy_128kbps/030021.mp3";

const params=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);

let audioType="song";
let audioUrl=SONG_URL;
let audioReady=false;

function formatDate(value){
 if(!value)return "";
 const p=value.split("-");
 return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:value;
}

function applyTemplate(value){
 let n=Number(value);
 if(!Number.isInteger(n)||n<1||n>8)n=1;
 const arch=$("arch");
 for(let i=1;i<=8;i++)arch.classList.remove("template-"+i);
 arch.classList.add("template-"+n);
}

function showField(id,value,fallback){
 $(id).textContent=value||fallback;
}

function showGroomContact(value){
 const phone=String(value||"").trim();
 const section=$("groomContact");
 if(!phone){
  section.hidden=true;
  return;
 }
 const tel=phone.replace(/[^\d+]/g,"");
 $("groomPhone").textContent=phone;
 $("groomPhone").href="tel:"+tel;
 $("groomCall").href="tel:"+tel;
 section.hidden=false;
}

function setupWhatsAppShare(){
 const message=
  "💍❤️ دعوة زفاف "+
  $("groom").textContent.trim()+" و"+
  $("bride").textContent.trim()+"\n"+
  "نتشرف بدعوتكم لمشاركتنا فرحتنا ❤️\n"+
  window.location.href;

 $("whatsappShare").href=
  "https://wa.me/?text="+encodeURIComponent(message);
}

function setAudio(type,url){
 audioType=String(type||"song").toLowerCase();
 audioUrl=String(url||"").trim();

 if(audioType==="none"){
  $("audioControl").classList.remove("show");
  return;
 }

 if(!audioUrl){
  audioUrl=audioType==="quran"?QURAN_URL:SONG_URL;
 }

 const audio=$("invitationAudio");
 audio.pause();
 audio.src=audioUrl;
 audio.load();

 $("audioControl").classList.add("show");
 $("audioControl").textContent=
  audioType==="quran"?"▶️ تشغيل القرآن":"▶️ تشغيل الأغنية";
 audioReady=true;
}

async function playAudio(){
 if(audioType==="none")return;

 const audio=$("invitationAudio");

 if(!audioReady){
  setAudio(audioType,audioUrl);
 }

 try{
  await audio.play();
  $("audioControl").textContent=
   audioType==="quran"?"🔇 إيقاف القرآن":"🔇 إيقاف الأغنية";
 }catch(error){
  $("audioControl").textContent=
   audioType==="quran"?"▶️ اضغط لتشغيل القرآن":"▶️ اضغط لتشغيل الأغنية";
  $("audioControl").classList.add("show");
 }
}

$("audioControl").addEventListener("click",async()=>{
 const audio=$("invitationAudio");
 if(audio.paused){
  await playAudio();
 }else{
  audio.pause();
 }
});

$("invitationAudio").addEventListener("ended",()=>{
 $("audioControl").textContent="▶️ تشغيل الصوت";
});

async function loadInvitation(){
 const defaults={
  groom:"محمد",
  bride:"نور",
  date:"يحدد لاحقاً",
  time:"الثامنة مساءً",
  place:"قاعة الأفراح"
 };

 const slug=params.get("invite");

 if(!slug){
  showField("groom",params.get("groom"),defaults.groom);
  showField("bride",params.get("bride"),defaults.bride);
  showField("date",formatDate(params.get("date")),defaults.date);
  showField("time",params.get("time"),defaults.time);
  showField("place",params.get("place"),defaults.place);
  showGroomContact(params.get("contact_phone")||params.get("phone"));
  applyTemplate(params.get("template"));
  setAudio(params.get("audio_type")||"song",params.get("audio_url")||"");
  setupWhatsAppShare();
  return;
 }

 $("hint").textContent="جارٍ تحميل تفاصيل الدعوة...";

 try{
  const {data,error}=await db.rpc(
   "get_invitation_by_slug",
   {p_slug:slug}
  );

  if(error)throw error;

  const item=Array.isArray(data)?data[0]:data;
  if(!item)throw new Error("Invitation not found");

  showField("groom",item.groom_name,defaults.groom);
  showField("bride",item.bride_name,defaults.bride);
  showField("date",formatDate(item.wedding_date),defaults.date);
  showField("time",item.wedding_time,defaults.time);
  showField("place",item.venue_name,defaults.place);

  if(item.day_name){
   $("date").textContent+=" — "+item.day_name;
  }

  showGroomContact(item.contact_phone);
  applyTemplate(item.template_id);
  setAudio(item.audio_type||"song",item.audio_url||"");
  setupWhatsAppShare();
  $("hint").textContent="انتظر 3 دقات حتى تُفتح الدعوة";

 }catch(error){
  console.error(error);
  $("hint").textContent="تعذر تحميل الدعوة. حاول تحديث الصفحة.";
  setAudio("song",SONG_URL);
 }
}

function petals(){
 const symbols=["🌸","🌹","✿","❀"];
 for(let i=0;i<45;i++){
  setTimeout(()=>{
   const p=document.createElement("span");
   p.className="petal";
   p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
   p.style.left=Math.random()*100+"vw";
   p.style.fontSize=(14+Math.random()*15)+"px";
   p.style.setProperty("--drift",(Math.random()*180-90)+"px");
   p.style.animationDuration=(4+Math.random()*5)+"s";
   document.body.appendChild(p);
   setTimeout(()=>p.remove(),10000);
  },i*65);
 }
}

function knockSound(){
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(100,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(45,ctx.currentTime+.12);
  gain.gain.setValueAtTime(.35,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.14);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+.15);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

$("copyPhone").addEventListener("click",async()=>{
 const phone="07867430232";
 try{
  await navigator.clipboard.writeText(phone);
  $("copyStatus").textContent="تم نسخ رقم التواصل ✓";
 }catch(e){
  $("copyStatus").textContent="رقم التواصل: "+phone;
 }
});

$("start").addEventListener("click",()=>{
 const start=$("start");
 const arch=$("arch");
 const hint=$("hint");
 const invite=$("invite");

 start.disabled=true;

 /* محاولة تشغيل الصوت مباشرة من ضغطة المستخدم */
 playAudio();

 hint.textContent="طَق... طَق... طَق...";
 let count=0;

 function nextKnock(){
  count++;
  arch.classList.remove("knock");
  void arch.offsetWidth;
  arch.classList.add("knock");
  knockSound();

  if(count<3){
   setTimeout(nextKnock,750);
  }else{
   setTimeout(()=>{
    arch.classList.remove("knock");
    arch.classList.add("open");
    petals();
    hint.textContent="تم فتح الدعوة ♥";
    invite.classList.add("show");

    setTimeout(()=>{
     invite.scrollIntoView({
      behavior:"smooth",
      block:"start"
     });
    },500);
   },650);
  }
 }

 nextKnock();
});

loadInvitation();
</script>
